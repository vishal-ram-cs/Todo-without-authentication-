<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Base Layout */
        body {
            background: #fdfdfd;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: "Poppins", sans-serif;
            color: #111;
        }
        .todo-container {
            max-width: 650px;
            width: 100%;
            margin-top: 60px;
        }

        /* Title */
        .page-title {
            font-weight: 700;
            font-size: 2.2rem;
            color: #000;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 35px;
        }

        /* Input Form */
        .task-input {
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            border: 1.5px solid #000;
            transition: 0.2s ease;
        }
        .task-input:focus {
            border-color: #333;
            box-shadow: none;
        }
        .add-btn {
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            background: #000;
            color: #fff;
            border: none;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .add-btn:hover {
            background: #333;
        }

        /* Task Cards */
        .todo-card {
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .todo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        /* Task Titles */
        .task-title {
            font-size: 1rem;
            font-weight: 500;
            color: #111;
            word-break: break-word;
        }
        .text-strikethrough {
            text-decoration: line-through;
            color: #6c757d !important;
        }

        /* Action Buttons */
        .btn-action {
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-action:hover {
            transform: translateY(-1px);
        }
        .btn-outline-dark {
            border: 1.5px solid #000;
            color: #000;
        }
        .btn-outline-dark:hover {
            background: #000;
            color: #fff;
        }

        /* Card spacing */
        .card-body {
            padding: 14px 18px;
        }
    </style>
</head>
<body>
<div class="container todo-container">
    <h1 class="page-title">Todo Application</h1>

    <!-- Task Input -->
    <form th:action="@{/}" method="post" class="row g-2 mb-4">
        <div class="col-md-9">
            <input class="form-control task-input" type="text" name="title" placeholder="Add a new task..." required>
        </div>
        <div class="col-md-3 d-grid">
            <button type="submit" class="btn add-btn">
                <i class="bi bi-plus-lg"></i> Add
            </button>
        </div>
    </form>

    <!-- Task List -->
    <div>
        <th:block th:each="task : ${Tasks}">
            <div class="card todo-card mb-3">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <span class="task-title"
                          th:classappend="${task.completed} ? ' text-strikethrough'"
                          th:text="${task.title}">Task Title</span>

                    <div class="d-flex">
                        <a th:href="@{/{id}/toggle(id=${task.id})}"
                           class="btn btn-outline-dark btn-sm btn-action">
                            <i class="bi bi-check2-square"></i> Toggle
                        </a>
                        <a th:href="@{/{id}/delete(id=${task.id})}"
                           class="btn btn-outline-dark btn-sm btn-action ms-2">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</div>
</body>
</html>
